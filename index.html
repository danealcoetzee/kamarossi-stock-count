<!doctype html>
<html lang="en-ZA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'">
<meta name="theme-color" content="#1B5DA6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Kamarossi Stock Count</title>
<style>
@font-face{font-family:"Barlow";font-weight:400;font-display:swap;src:url(fonts/barlow-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-weight:500;font-display:swap;src:url(fonts/barlow-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-weight:600;font-display:swap;src:url(fonts/barlow-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-weight:700;font-display:swap;src:url(fonts/barlow-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:600;font-display:swap;src:url(fonts/barlow-condensed-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:700;font-display:swap;src:url(fonts/barlow-condensed-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-weight:500;font-display:swap;src:url(fonts/ibm-plex-mono-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-weight:600;font-display:swap;src:url(fonts/ibm-plex-mono-latin-600-normal.woff2) format("woff2")}
/* Layout: a one-handed scanner console for the EDA52. Status strip on top, the drum being counted in the middle,
   keypad and Save under the thumb, four tabs at the bottom. Colours follow the four cable cores in the Kamarossi mark. */
:root{
  --bg:#EDF1F5; --surface:#FFFFFF; --surface-2:#F5F7FA; --ink:#0E1620; --muted:#55626F; --line:#D2D9E1;
  --accent:#1B5DA6; --accent-ink:#FFFFFF; --core:#1E9BD3; --plate:#FFFFFF;
  --ok:#1F7A36; --ok-bg:#E2F2E6; --warn:#8A5700; --warn-bg:#FFF0D2; --bad:#B3261E; --bad-bg:#FCE6E3; --info:#1B5DA6; --info-bg:#E3EDF8;
  --key:#E3E9EF; --key-ink:#0E1620; --shade:rgba(10,18,28,.45);
  --f-ui:"Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-num:"Barlow Condensed", "Barlow", system-ui, sans-serif;
  --f-code:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0B1015; --surface:#131A21; --surface-2:#19222B; --ink:#E8EDF2; --muted:#98A6B3; --line:#25303B;
    --accent:#62A6EE; --accent-ink:#06121F; --core:#4CC3F0;
    --ok:#5ACF79; --ok-bg:#11301B; --warn:#F1B14A; --warn-bg:#33250B; --bad:#FF7D70; --bad-bg:#3A1511; --info:#7FB8F2; --info-bg:#13263A;
    --key:#1E2832; --key-ink:#E8EDF2; --shade:rgba(0,0,0,.6); color-scheme:dark;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg)}
body{background:var(--bg);color:var(--ink);font:500 17px/1.35 var(--f-ui);-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
img{max-width:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--core);outline-offset:2px}
.mono{font-family:var(--f-code);font-weight:600;letter-spacing:.01em;overflow-wrap:anywhere}
#app{height:100%;display:flex;flex-direction:column;max-width:600px;margin:0 auto;background:var(--bg)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top strip: logo, the area being counted, sending status */
.top{display:flex;align-items:center;gap:8px;padding-block:5px;background:var(--surface);border-bottom:1px solid var(--line)}
.plate{background:var(--plate);border-radius:7px;padding:3px 5px;display:inline-flex;flex:none;border:1px solid var(--line)}
.plate img{height:19px;width:auto;display:block}
.areabtn{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;border:0;background:none;padding:2px 4px;text-align:left;border-radius:8px}
.areabtn .lbl{font-size:10.5px}
.areabtn .v{font:600 15px/1.2 var(--f-ui);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.areabtn .v.unset{color:var(--warn)}
.sync{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:4px 9px;font:600 12.5px var(--f-ui);white-space:nowrap;max-width:46%;overflow:hidden;text-overflow:ellipsis}
.sync i{width:9px;height:9px;border-radius:50%;background:var(--muted);display:inline-block;flex:none}
.sync.ok i{background:var(--ok)} .sync.warn i{background:var(--warn)}

main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;overflow:auto;padding-block:8px 12px}
#v-count{display:flex;flex-direction:column;gap:6px;overflow:hidden;padding-block:6px}

/* count view */
.lbl{font:600 11px var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.scanrow{display:flex;align-items:center;gap:6px;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:3px 4px 3px 10px;flex:none}
.scanrow.ready{border-color:var(--ok)}
.scanrow.typing{border-color:var(--accent)}
.dot{flex:none;width:10px;height:10px;border-radius:50%;background:var(--muted)}
.scanrow.ready .dot{background:var(--ok)}
#scan{flex:1;min-width:0;border:0;background:transparent;font:600 18px var(--f-code);color:var(--ink);padding:9px 0;outline:none;text-transform:uppercase}
#scan::placeholder{font-family:var(--f-ui);font-weight:500;text-transform:none;color:var(--muted)}
.mini{flex:none;border:1px solid var(--line);background:var(--surface-2);border-radius:9px;padding:0 12px;height:38px;font:600 15px var(--f-ui);display:inline-flex;align-items:center;justify-content:center}
.mini svg{width:22px;height:22px}
.mini.cam{padding:0 10px;background:var(--accent);color:var(--accent-ink);border-color:transparent}
.card{flex:1;min-height:0;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:7px}
.empty{display:flex;flex-direction:column;gap:6px;justify-content:center;flex:1}
.empty .big{font:700 23px/1.1 var(--f-num);margin:0}
.empty p{margin:0;color:var(--muted);font-size:15.5px}
.k8sum{font-size:14px;color:var(--muted);margin:0}
.idrow{display:flex;align-items:center;gap:8px}
.idrow b{font:700 22px/1 var(--f-num);letter-spacing:.03em;white-space:nowrap}
.idrow .code{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.morebtn{flex:none;width:44px;height:34px;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;display:inline-flex;align-items:center;justify-content:center}
.morebtn svg{width:20px;height:20px}
.code{font:600 14.5px var(--f-code)}
.desc{font-size:14.5px;color:var(--muted);line-height:1.25}
.card .desc{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.batch{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px}
.batch .mono{font-size:21px}
.k8{font-size:13.5px;color:var(--muted)}
.cl{font-size:14px;line-height:1.3;padding:4px 0 4px 9px;border-left:4px solid var(--line)}
.cl.ok{border-color:var(--ok)} .cl.warn{border-color:var(--warn)} .cl.bad{border-color:var(--bad)} .cl.info{border-color:var(--info)}
.tag{display:inline-flex;align-items:center;gap:4px;border-radius:6px;padding:2px 7px;font:600 12.5px var(--f-ui);background:var(--surface-2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.tag.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.tag.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.tag.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.tag.info{background:var(--info-bg);color:var(--info);border-color:transparent}
.ban{border-radius:10px;padding:9px 11px;font-size:15px;line-height:1.3;border-left:5px solid}
.ban.ok{background:var(--ok-bg);border-color:var(--ok)}
.ban.warn{background:var(--warn-bg);border-color:var(--warn)}
.ban.bad{background:var(--bad-bg);border-color:var(--bad)}
.ban.info{background:var(--info-bg);border-color:var(--info)}
.ban b{font-weight:700}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.btn{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:10px 14px;font:600 15.5px var(--f-ui);min-height:44px}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.bad{background:var(--bad);color:var(--surface);border-color:transparent}
.btn.small{min-height:36px;padding:6px 10px;font-size:14px}
.btn:disabled{opacity:.5}
.photos{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.thumb{position:relative;width:52px;height:52px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--surface-2);flex:none;padding:0}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb span{position:absolute;left:0;right:0;bottom:0;font:600 10.5px var(--f-ui);background:var(--shade);color:#fff;text-align:center;padding:1px 0}
.err{color:var(--bad);font-weight:600;font-size:14.5px}
.qtybar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 2px;flex:none}
.qtybar .lbl{display:block}
.qty{font:700 34px/1 var(--f-num);font-variant-numeric:tabular-nums}
.qty small{font:600 18px var(--f-num);color:var(--muted);margin-left:4px}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;flex:none}
.pad button{height:46px;border:0;border-radius:10px;background:var(--key);color:var(--key-ink);font:600 25px var(--f-num);display:flex;align-items:center;justify-content:center}
.pad button:active{filter:brightness(.92)}
.pad .w2{grid-column:span 2}
.pad .fn{font:600 16px var(--f-ui)}
.pad .save{background:var(--accent);color:var(--accent-ink);font:700 21px var(--f-ui)}
.pad svg{width:28px;height:28px}

/* tabs */
.tabs{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line)}
.tabs button{height:48px;border:0;background:none;color:var(--muted);font:600 15px var(--f-ui);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;line-height:1.1}
.tabs button small{font:600 12px var(--f-ui);font-variant-numeric:tabular-nums}
.tabs button[aria-current="page"]{color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}

/* lists */
h2{font:700 24px/1.1 var(--f-num);letter-spacing:.02em;margin:2px 0 4px;text-wrap:balance}
.sub{color:var(--muted);font-size:14.5px;margin:0 0 10px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chipbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font:600 14px var(--f-ui)}
.chipbtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.search{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 12px;font:500 16px var(--f-ui);margin-bottom:10px}
.items{display:flex;flex-direction:column;gap:6px}
.item{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:9px 11px}
.item[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.item .r1{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.item .r1 .mono{font-size:16.5px}
.item .q{font:700 20px var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.item .r2{font-size:14px;color:var(--muted);margin-top:2px}
.item .r3{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px;align-items:center;font-size:13px;color:var(--muted)}
.item.void{opacity:.55}
.item.void .mono{text-decoration:line-through}
.pagehd{font:700 13px var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:12px 2px 2px}
.findrow{display:grid;grid-template-columns:44px 1fr;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;align-items:baseline}
.findrow .ln{font:600 14px var(--f-code);color:var(--muted)}
.findrow .mono{font-size:16px}
.findrow .pc{font-size:13.5px;color:var(--muted)}
.findrow.done{opacity:.5}
.findrow.done .mono{text-decoration:line-through}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 10px}
.stat div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.stat b{display:block;font:700 26px/1 var(--f-num);font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--key);overflow:hidden;margin:-2px 0 12px}
.bar i{display:block;height:100%;background:var(--ok)}

/* setup and load */
.sec{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px;display:flex;flex-direction:column;gap:10px}
.sec h3{margin:0;font:700 19px var(--f-num);letter-spacing:.03em;text-transform:uppercase}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font:600 13px var(--f-ui);color:var(--muted)}
.field input,.field textarea{border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:10px;padding:10px 12px;font:500 17px var(--f-ui)}
#code{font:600 20px var(--f-code);letter-spacing:.06em;text-transform:uppercase}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.checks label{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface-2);font-size:15px}
.checks input{width:20px;height:20px;accent-color:var(--accent)}
.checks small{color:var(--muted);font-size:12.5px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:15px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.note{font-size:14.5px;color:var(--muted);margin:0}
.steps{margin:0;padding-left:20px;font-size:15px;display:flex;flex-direction:column;gap:3px}
.brandhd{display:flex;align-items:center;gap:10px;margin:8px 0 14px}
.brandhd .plate img{height:28px}

/* sheet */
.sheet{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;justify-content:flex-end}
.sheet-back{position:absolute;inset:0;background:var(--shade)}
.sheet-body{position:relative;background:var(--surface);border-radius:16px 16px 0 0;max-height:88%;overflow:auto;padding-block:14px calc(16px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 30px var(--shade);max-width:600px;width:100%;margin:0 auto}
.sheet-body h3{margin:0 0 8px;font:700 22px var(--f-num);letter-spacing:.02em;padding-right:70px}
.sheet-x{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:10px;border:1px solid var(--line);background:var(--surface-2);border-radius:9px;padding:6px 10px;font:600 14px var(--f-ui)}
.res{display:flex;flex-direction:column;gap:6px;max-height:50vh;overflow:auto}
.res button{text-align:left;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.res .code,.res b{display:block}
.res .desc{display:block}
.bigph{width:100%;border-radius:10px;border:1px solid var(--line);display:block}
.phgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px}
.phgrid button{padding:0;border:1px solid var(--line);border-radius:9px;overflow:hidden;aspect-ratio:1;max-width:100%;background:var(--surface-2);position:relative}
.phgrid img{width:100%;height:100%;object-fit:cover;display:block}
.phgrid span{position:absolute;left:0;right:0;bottom:0;font:600 11px var(--f-ui);background:var(--shade);color:#fff;padding:1px 0;text-align:center}
.minipad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.minipad button{height:48px;border:0;border-radius:10px;background:var(--key);color:var(--key-ink);font:600 24px var(--f-num)}
.parts{display:flex;flex-direction:column;gap:6px}
.parts .btn{text-align:left;display:flex;justify-content:space-between;align-items:center;gap:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(6px + env(safe-area-inset-top,0px));z-index:40;background:var(--ink);color:var(--surface);border-radius:12px;padding:10px 16px;font:600 15.5px var(--f-ui);box-shadow:0 6px 24px var(--shade);max-width:calc(100% - 32px)}
.toast.bad{background:var(--bad);color:var(--surface)}
.loading{display:flex;align-items:center;justify-content:center;height:100%;color:var(--muted);text-align:center;padding:20px}
@media (min-height:760px){.pad button{height:54px}.qty{font-size:38px}}
@media (max-height:600px){.pad button{height:41px}.qty{font-size:30px}.tabs button{height:44px}}
</style>
</head>
<body>
<div id="app">
  <header class="top gut" id="top">
    <span class="plate"><img src="logo.jpg" alt="Kamarossi"></span>
    <button class="areabtn" data-act="area"><span class="lbl">Area</span><span class="v unset" id="areaVal">Set the area</span></button>
    <button class="sync" id="sendChip" data-act="send"><i></i><span>Nothing to send</span></button>
  </header>

  <main>
    <section id="v-load" class="view gut" aria-label="Load a count" hidden>
      <div class="brandhd"><span class="plate"><img src="logo.jpg" alt="Kamarossi"></span><b class="lbl">Stock count</b></div>
      <h2>Open a count</h2>
      <p class="sub">Pick the count, then type the count code you were given. You only do this once per count on each device.</p>
      <div class="items" id="loadList"><p class="note">Looking for counts…</p></div>
      <div class="field" style="margin-top:12px"><label for="code">Count code</label><input id="code" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" placeholder="ABCDE-12345"></div>
      <div class="row"><button class="btn pri" data-act="unlock" id="unlockBtn">Open the count</button><button class="btn" data-act="load-cancel" id="loadCancel" hidden>Cancel</button></div>
      <p class="note" id="loadMsg" style="margin-top:10px"></p>
    </section>

    <section id="v-count" class="view gut" aria-label="Count" hidden>
      <div class="scanrow" id="scanrow">
        <span class="dot" aria-hidden="true"></span>
        <input id="scan" inputmode="none" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" enterkeyhint="go" placeholder="Tap here, then scan" aria-label="Scanned barcode">
        <button class="mini" data-act="type" id="typeBtn">Type</button>
        <button class="mini cam" data-act="photo" data-kind="label" aria-label="Photo of the label"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></button>
      </div>
      <div class="card" id="card"><div class="loading">Loading…</div></div>
      <div class="qtybar" id="qtybar">
        <div><span class="lbl" id="qtyLbl">Metres</span><div class="qty" id="qtyVal">0<small>m</small></div></div>
      </div>
      <div class="pad" id="pad">
        <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
        <button data-k="bk" aria-label="Delete last digit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 5H9l-6 7 6 7h12z"/><path d="M17 9l-6 6M11 9l6 6"/></svg></button>
        <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
        <button data-k="clr" class="fn">Clear</button>
        <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
        <button data-k=".">.</button>
        <button data-k="0" class="w2">0</button>
        <button data-act="save" class="w2 save" id="saveBtn">Save</button>
      </div>
    </section>

    <section id="v-list" class="view gut" aria-label="Counted" hidden></section>
    <section id="v-find" class="view gut" aria-label="To find" hidden></section>
    <section id="v-setup" class="view gut" aria-label="Setup" hidden></section>
  </main>

  <nav class="tabs gut" id="tabs" aria-label="Views">
    <button data-tab="count" aria-current="page">Count</button>
    <button data-tab="list">Counted<small id="nList"></small></button>
    <button data-tab="find">To find<small id="nFind"></small></button>
    <button data-tab="setup">Setup</button>
  </nav>

  <div id="toast" class="toast" role="status" hidden></div>
  <div id="sheet" class="sheet" hidden>
    <div class="sheet-back" data-act="close"></div>
    <div class="sheet-body gut" role="dialog" aria-modal="true"><button class="sheet-x" data-act="close">Close</button><div id="sheetIn"></div></div>
  </div>
  <input type="file" id="cam" accept="image/*" capture="environment" hidden>
</div>

<script>
(() => {
'use strict';
const APPV = '2.0.1';
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const norm = s => String(s ?? '').toUpperCase().replace(/\s+/g, ' ').trim();
const compact = s => norm(s).replace(/[^A-Z0-9]/g, '');
const UNIT = {MT: 'm', EA: 'ea', KG: 'kg'};
const UNITW = {MT: 'Metres', EA: 'Quantity', KG: 'Kilograms'};
const LS = {
  get(k, d) { try { const v = localStorage.getItem('kamcount.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('kamcount.' + k, JSON.stringify(v)); } catch (e) { /* storage off */ } },
};
const rnd = n => Math.random().toString(36).slice(2, 2 + n);
const fmtQty = q => (Math.round(Number(q) * 100) / 100).toLocaleString('en-ZA', {maximumFractionDigits: 2}).replace(/ /g, ' ');
const hhmm = iso => { try { return new Date(iso).toLocaleTimeString('en-ZA', {hour: '2-digit', minute: '2-digit'}); } catch (e) { return ''; } };
const dmy = iso => { try { const d = new Date(iso); return d.toLocaleDateString('en-ZA', {day: '2-digit', month: 'short'}) + ' ' + hhmm(iso); } catch (e) { return ''; } };
const pad2 = n => String(n).padStart(2, '0');
const stamp = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())} ${pad2(d.getHours())}${pad2(d.getMinutes())}`;
const nowIso = () => new Date().toISOString();

/* ---------- state ---------- */
const S = {
  list: null, idx: null, countId: '', gname: {}, counts: [], pickCount: '',
  setup: Object.assign({team: '', store: '', device: '', groups: null}, LS.get('setup', {})),
  area: LS.get('area', ''), areas: LS.get('areas', []),
  cur: null, held: null, recs: new Map(),
  tab: 'count', typing: false, lastScan: null,
  listFilter: 'all', listQ: '', listN: 150, findQ: '', findAll: false,
  persisted: null, sendParts: null, sendAll: false,
};
if (!S.setup.device) { S.setup.device = 'EDA52-' + rnd(3).toUpperCase(); LS.set('setup', S.setup); }
const devTag = () => (S.setup.device || 'dev').replace(/[^A-Za-z0-9-]/g, '').slice(0, 20) || 'dev';
const newId = () => `${devTag()}-${Date.now().toString(36)}-${rnd(4)}`;

/* ---------- device store (IndexedDB, memory fallback) ---------- */
const Store = (() => {
  const mem = {recs: new Map(), photos: new Map(), meta: new Map()};
  let dbp = null, ok = true;
  function open() {
    if (!ok) return Promise.reject(new Error('off'));
    if (!dbp) {
      dbp = new Promise((res, rej) => {
        try {
          const r = indexedDB.open('kamarossi-stock-count', 1);
          r.onupgradeneeded = () => {
            const d = r.result;
            if (!d.objectStoreNames.contains('recs')) d.createObjectStore('recs', {keyPath: 'id'});
            if (!d.objectStoreNames.contains('photos')) d.createObjectStore('photos');
            if (!d.objectStoreNames.contains('meta')) d.createObjectStore('meta');
          };
          r.onsuccess = () => res(r.result);
          r.onerror = () => rej(r.error);
          r.onblocked = () => rej(new Error('blocked'));
        } catch (e) { rej(e); }
      }).catch(e => { ok = false; throw e; });
    }
    return dbp;
  }
  function run(store, mode, fn) {
    return open().then(d => new Promise((res, rej) => {
      const t = d.transaction(store, mode), s = t.objectStore(store);
      let r; try { r = fn(s); } catch (e) { rej(e); return; }
      t.oncomplete = () => res(r ? r.result : undefined);
      t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    }));
  }
  return {
    async put(store, val, key) {
      try { await run(store, 'readwrite', s => key === undefined ? s.put(val) : s.put(val, key)); }
      catch (e) { mem[store].set(key === undefined ? val.id : key, val); }
    },
    async get(store, key) {
      try { const v = await run(store, 'readonly', s => s.get(key)); return v !== undefined ? v : mem[store].get(key); }
      catch (e) { return mem[store].get(key); }
    },
    async del(store, key) { mem[store].delete(key); try { await run(store, 'readwrite', s => s.delete(key)); } catch (e) { /* ignore */ } },
    async all(store) {
      let a = []; try { a = (await run(store, 'readonly', s => s.getAll())) || []; } catch (e) { /* ignore */ }
      for (const v of mem[store].values()) if (!a.some(x => x.id === v.id)) a.push(v);
      return a;
    },
    durable: () => ok,
  };
})();

/* ---------- K8 list and lookups ---------- */
function buildIndex(list) {
  const batch = new Map(), tok = new Map(), comp = new Map(), prod = new Map(), byLid = new Map(), byCode = new Map();
  const add = (m, k, i) => { if (!k) return; const a = m.get(k); if (a) { if (!a.includes(i)) a.push(i); } else m.set(k, [i]); };
  list.lines.forEach((L, i) => {
    byLid.set(L[0], i); add(byCode, L[1], i);
    const b = norm(L[2]); if (!b) return;
    add(batch, b, i); add(tok, b.split(' ')[0], i); add(comp, compact(b), i);
  });
  for (const c of Object.keys(list.products)) prod.set(norm(c), c);
  return {batch, tok, comp, prod, byLid, byCode};
}
const line = i => S.list.lines[i];
const lineByLid = lid => { const i = S.idx.byLid.get(lid); return i === undefined ? null : S.list.lines[i]; };
const grpOf = code => String(code || '').split('/')[0];
const gname = g => S.gname[g] || g;
const pageLine = lid => { const p = String(lid || '').split('-'); return p.length === 3 ? `page ${+p[1]} · line ${+p[2]}` : ''; };
const prodInfo = code => (code && S.list.products[code]) || null;
const hasBatchLines = code => (S.idx.byCode.get(code) || []).some(i => norm(line(i)[2]));
const selGroups = () => (S.setup.groups && S.setup.groups.length ? S.setup.groups : S.list.count.groups);

function matchBatch(raw) {
  const v = norm(raw); if (!v) return {kind: 'none', lines: []};
  let L = S.idx.batch.get(v); if (L) return {kind: 'exact', lines: L};
  const t = v.split(' ')[0];
  if (t.length >= 4) { L = S.idx.tok.get(t); if (L) return {kind: 'token', lines: L}; }
  if (v.length > 24) { L = S.idx.batch.get(v.slice(0, 24).trim()); if (L) return {kind: 'prefix', lines: L}; }
  const c = compact(v); if (c.length >= 5) { L = S.idx.comp.get(c); if (L) return {kind: 'compact', lines: L}; }
  return {kind: 'none', lines: []};
}

/* ---------- records on this device ---------- */
const recs = () => [...S.recs.values()].filter(r => r && r.count === S.countId);
const live = () => recs().filter(r => !r.void);
const unsent = r => !r.sentAt || (r.changedAt && r.changedAt > r.sentAt);
function countedFor(cur) {
  if (!cur) return [];
  const others = live().filter(r => r.id !== cur.id);
  if (cur.line) {
    const L = lineByLid(cur.line);
    if (L && !norm(L[2])) return [];
    return others.filter(r => r.line === cur.line);
  }
  if (cur.batch) { const b = norm(cur.batch); return others.filter(r => norm(r.batch) === b); }
  return [];
}
const lineCounted = (lid, exceptId) => live().some(r => r.id !== exceptId && r.line === lid);

/* ---------- the drum being counted ---------- */
function blankCur() {
  return {id: newId(), product: '', productRaw: '', productSrc: '', batch: '', batchRaw: '', batchSrc: '', match: '',
    line: '', cands: null, multi: false, photos: [], qty: '', note: '', unknown: '', dupOk: false, ackMismatch: false, err: '', scans: []};
}
function ensureCur() { if (!S.cur) S.cur = blankCur(); return S.cur; }
const hasData = c => !!(c && (c.batch || c.qty || c.photos.length || c.note || (c.product && c.productSrc !== 'scan')));
function persistCur() {
  if (!S.cur) { LS.set('cur', null); return; }
  LS.set('cur', Object.assign({}, S.cur, {count: S.countId, photos: S.cur.photos.map(p => ({key: p.key, kind: p.kind}))}));
}
async function restoreCur(c) {
  if (!c || !c.id || c.count !== S.countId) return;
  const cur = Object.assign(blankCur(), c, {photos: []});
  for (const p of (c.photos || [])) { const b = await Store.get('photos', p.key); if (b) cur.photos.push({key: p.key, kind: p.kind, url: URL.createObjectURL(b)}); }
  S.cur = cur;
}
function chooseLine(cands, product) {
  let c = cands;
  if (product) { const f = c.filter(i => line(i)[1] === product); if (f.length) c = f; }
  const prods = [...new Set(c.map(i => line(i)[1]))];
  if (prods.length > 1) return {need: true, cands: c};
  const free = c.find(i => !lineCounted(line(i)[0], S.cur && S.cur.id));
  return {line: free !== undefined ? free : c[0], multi: c.length > 1};
}
function setBatch(m, raw, src) {
  const cur = ensureCur();
  cur.batchRaw = raw; cur.batchSrc = src; cur.match = m.kind; cur.unknown = ''; cur.dupOk = false; cur.err = '';
  if (m.kind === 'none') { cur.batch = norm(raw); cur.line = ''; cur.cands = null; cur.multi = false; return; }
  const ch = chooseLine(m.lines, cur.productSrc === 'scan' || cur.productSrc === 'pick' ? cur.product : '');
  if (ch.need) { cur.cands = ch.cands; cur.batch = line(ch.cands[0])[2]; cur.line = ''; return; }
  const L = line(ch.line);
  cur.line = L[0]; cur.batch = L[2]; cur.multi = ch.multi; cur.cands = null;
  if (!cur.product) { cur.product = L[1]; cur.productSrc = 'batch'; }
}
function pickCand(i) {
  const cur = S.cur; if (!cur) return;
  const L = line(i); cur.line = L[0]; cur.batch = L[2]; cur.cands = null;
  if (!cur.product || cur.productSrc === 'batch') { cur.product = L[1]; cur.productSrc = 'batch'; }
  const same = (S.idx.batch.get(norm(L[2])) || []).filter(j => line(j)[1] === L[1]);
  const free = same.find(j => !lineCounted(line(j)[0], cur.id));
  if (free !== undefined) cur.line = line(free)[0];
  cur.multi = same.length > 1;
}
function issues(cur) {
  const out = [];
  if (!cur) return out;
  const L = cur.line ? lineByLid(cur.line) : null;
  if (cur.unknown) out.push({k: 'unknown', lvl: 'warn'});
  if (cur.cands) out.push({k: 'cands', lvl: 'warn'});
  if (L && cur.product && L[1] !== cur.product && (cur.productSrc === 'scan' || cur.productSrc === 'pick')) out.push({k: 'other_product', lvl: 'bad'});
  if (cur.batch && !cur.line && !cur.cands) out.push({k: 'not_in_k8', lvl: 'warn'});
  if (!cur.batch && !cur.line && cur.product && hasBatchLines(cur.product)) out.push({k: 'need_batch', lvl: 'info'});
  if (!cur.batch && !cur.product && cur.photos.length) out.push({k: 'no_label', lvl: 'warn'});
  if (L && !selGroups().includes(grpOf(L[1]))) out.push({k: 'other_group', lvl: 'info'});
  const dup = countedFor(cur);
  if (dup.length && !cur.dupOk) out.push({k: 'dup', lvl: 'bad'});
  return out;
}
const needsPhoto = cur => {
  const ks = issues(cur).map(x => x.k);
  return ks.includes('other_product') || ks.includes('not_in_k8') || ks.includes('no_label') || cur.batchSrc === 'typed' || (!cur.batch && !cur.line);
};
function unitOf(cur) {
  const code = cur.product || (cur.line ? (lineByLid(cur.line) || [])[1] : '');
  const p = prodInfo(code); return p ? p[1] : 'MT';
}
function saveBlock(cur, force) {
  if (!cur || !(cur.batch || cur.product || cur.photos.length)) return 'Scan the label, type the batch, or pick the product first.';
  const iss = issues(cur).map(x => x.k);
  if (iss.includes('dup')) return 'This was counted already. Choose Same drum or Another piece.';
  if (iss.includes('cands')) return 'Pick the product for this batch.';
  if (cur.unknown) return 'Say what the scanned code is first.';
  if (!(Number(cur.qty) > 0)) return `Enter the ${unitOf(cur) === 'MT' ? 'metres' : 'quantity'}.`;
  if (!force && needsPhoto(cur) && !cur.photos.some(p => p.kind === 'label')) return 'PHOTO';
  return '';
}
function flagsFor(cur, force) {
  const f = new Set(issues(cur).map(x => x.k).filter(k => ['other_product', 'not_in_k8', 'no_label', 'other_group'].includes(k)));
  if (!cur.batch && (!cur.product || hasBatchLines(cur.product))) f.add('no_label');
  if (cur.dupOk) f.add('piece');
  if (cur.batchSrc === 'typed') f.add('typed');
  if (cur.multi) f.add('batch_on_several_k8_lines');
  if (cur.match && !['exact', 'none', ''].includes(cur.match)) f.add('match_' + cur.match);
  if (force) f.add('no_photo');
  return [...f];
}

/* ---------- scanning ---------- */
function onScan(raw, src) {
  raw = String(raw || '').replace(/[\r\n\t]+/g, ' ').trim();
  if (!raw || !S.list) return;
  S.lastScan = {raw, at: Date.now(), src, len: raw.length};
  const v = norm(raw);
  if (/^LOC[:\-]/.test(v)) { setArea(raw.replace(/^LOC[:\-]\s*/i, '')); beep('ok'); toast('Area: ' + S.area); renderCount(); return; }
  const code = S.idx.prod.get(v);
  const m = code ? null : matchBatch(v);
  const cur = S.cur;
  if (cur && hasData(cur)) {
    const sameBatch = m && cur.batch && (norm(cur.batch) === v || (m.kind !== 'none' && m.lines.some(i => norm(line(i)[2]) === norm(cur.batch))));
    const newDrum = (code && cur.product && code !== cur.product && cur.qty) ||
                    (m && cur.batch && !sameBatch) ||
                    (m && m.kind !== 'none' && !cur.batch && cur.qty && cur.product && !m.lines.some(i => line(i)[1] === cur.product));
    if (newDrum) { S.held = {raw, src}; beep('warn'); renderCount(); return; }
  }
  const c0 = ensureCur(); c0.scans = (c0.scans || []).concat([raw]).slice(-6);
  if (code) { gotProduct(code, raw); return; }
  if (m.kind !== 'none') { setBatch(m, raw, src === 'typed' ? 'typed' : 'scan'); afterChange(true); return; }
  if (src === 'typed') { setBatch(m, raw, 'typed'); afterChange(false); return; }
  c0.unknown = raw; beep('warn'); afterChange(false);
}
function gotProduct(code, raw) {
  const cur = ensureCur();
  cur.product = code; cur.productRaw = raw; cur.productSrc = 'scan'; cur.err = ''; cur.ackMismatch = false;
  if (cur.cands) { const f = cur.cands.filter(i => line(i)[1] === code); if (f.length) pickCand(f[0]); }
  if (!cur.batch && !hasBatchLines(code)) { const ls = S.idx.byCode.get(code) || []; if (ls.length) cur.line = line(ls[0])[0]; }
  afterChange(true);
}
function afterChange(okBeep) {
  const lv = issues(S.cur).map(x => x.lvl);
  if (lv.includes('bad')) { beep('bad'); buzz([120, 80, 120]); }
  else if (lv.includes('warn')) beep('warn');
  else if (okBeep) beep('ok');
  persistCur(); renderCount();
}
async function resolveHeld(action) {
  const h = S.held; S.held = null;
  if (action === 'cancel' || !h) { renderCount(); return; }
  if (action === 'discard') { clearCur(); onScan(h.raw, h.src); return; }
  if (action === 'save') { const ok = await save(false, h); if (!ok) { S.held = h; renderCount(); } }
}
function setArea(a) {
  S.area = String(a || '').trim().slice(0, 40); LS.set('area', S.area);
  if (S.area) { S.areas = [S.area, ...S.areas.filter(x => x !== S.area)].slice(0, 12); LS.set('areas', S.areas); }
}

/* ---------- photos ---------- */
let photoKind = 'label';
function takePhoto(kind) { photoKind = kind || 'label'; const inp = $('#cam'); inp.value = ''; inp.click(); }
async function shrink(file, max, q) {
  let src;
  try { src = await createImageBitmap(file, {imageOrientation: 'from-image'}); }
  catch (e) { src = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); }); }
  const w = src.width, h = src.height, k = Math.min(1, max / Math.max(w, h));
  const c = document.createElement('canvas'); c.width = Math.round(w * k); c.height = Math.round(h * k);
  c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
  return new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('toBlob')), 'image/jpeg', q));
}
$('#cam').addEventListener('change', async e => {
  const f = e.target.files && e.target.files[0]; if (!f) { focusScan(); return; }
  const cur = ensureCur();
  let blob; try { blob = await shrink(f, 1600, 0.78); } catch (err) { blob = f; }
  const key = 'p-' + newId();
  await Store.put('photos', blob, key);
  cur.photos.push({key, kind: photoKind, url: URL.createObjectURL(blob)}); cur.err = '';
  if (photoKind === 'label' && issues(cur).some(i => i.k === 'other_product')) cur.ackMismatch = true;
  persistCur(); renderCount(); focusScan();
});

/* ---------- saving ---------- */
async function askPersist() {
  try { if (navigator.storage && navigator.storage.persist && !(await navigator.storage.persisted())) S.persisted = await navigator.storage.persist(); else if (navigator.storage && navigator.storage.persisted) S.persisted = await navigator.storage.persisted(); } catch (e) { /* ignore */ }
}
async function save(force, held) {
  const cur = S.cur;
  const block = saveBlock(cur, force);
  if (block) {
    if (cur) cur.err = block === 'PHOTO' ? 'PHOTO' : block; else toast(block, true);
    beep('warn'); renderCount(); return false;
  }
  if (!S.setup.team || !S.setup.store) { openWho(); return false; }
  const code = cur.product || (cur.line ? (lineByLid(cur.line) || [])[1] : '') || '';
  const p = prodInfo(code);
  const L = cur.line ? lineByLid(cur.line) : null;
  const t = nowIso();
  const rec = {
    v: 2, id: cur.id, count: S.countId, at: t, changedAt: t, sentAt: '',
    team: S.setup.team, store: S.setup.store, area: S.area || '', device: S.setup.device,
    code, desc: p ? p[0] : '', group: code ? grpOf(code) : '',
    batch: cur.batch || '', scanned: {product: cur.productRaw || '', batch: cur.batchRaw || ''}, scans: cur.scans || [],
    match: cur.batch ? (cur.line ? (cur.match || 'exact') : 'none') : (cur.line ? 'product' : 'no_label'),
    line: cur.line || '', k8batch: L ? L[2] : '',
    qty: Math.round(Number(cur.qty) * 100) / 100, unit: p ? p[1] : 'MT',
    photos: cur.photos.map(ph => ({key: ph.key, kind: ph.kind, sent: false})),
    flags: flagsFor(cur, force), note: cur.note || '', void: false, edits: [],
  };
  S.recs.set(rec.id, rec);
  await Store.put('recs', rec);
  toast(`Saved ${rec.batch || rec.code || 'count'} · ${fmtQty(rec.qty)} ${UNIT[rec.unit] || ''}`);
  beep('ok'); buzz(40);
  S.cur = null; persistCur();
  if (S.persisted === null) askPersist();
  if (held) onScan(held.raw, held.src); else renderAll();
  focusScan();
  return true;
}
function clearCur() {
  if (S.cur) for (const ph of S.cur.photos) { Store.del('photos', ph.key); try { URL.revokeObjectURL(ph.url); } catch (e) { /* ignore */ } }
  S.cur = null; S.held = null; persistCur(); renderCount(); focusScan();
}
async function patchRec(id, patch) {
  const rec = S.recs.get(id); if (!rec) return;
  Object.assign(rec, patch, {changedAt: nowIso()});
  await Store.put('recs', rec); renderAll();
}

/* ---------- sending ---------- */
const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(u8) { let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = CRC[(c ^ u8[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
async function makeZip(entries) {
  const enc = new TextEncoder(); const parts = [], central = []; let offset = 0;
  const d = new Date();
  const time = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
  const date = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
  for (const e of entries) {
    const data = new Uint8Array(await e.blob.arrayBuffer()); const name = enc.encode(e.name); const crc = crc32(data);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true);
    lh.setUint16(10, time, true); lh.setUint16(12, date, true); lh.setUint32(14, crc, true);
    lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true); lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
    parts.push(lh, name, data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true); ch.setUint16(10, 0, true);
    ch.setUint16(12, time, true); ch.setUint16(14, date, true); ch.setUint32(16, crc, true); ch.setUint32(20, data.length, true); ch.setUint32(24, data.length, true);
    ch.setUint16(28, name.length, true); ch.setUint16(30, 0, true); ch.setUint16(32, 0, true); ch.setUint16(34, 0, true); ch.setUint16(36, 0, true);

const normCode = c => String(c || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decryptList(env, code) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(normCode(code)), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name: 'PBKDF2', salt: b64(env.salt), iterations: env.iter, hash: 'SHA-256'}, base, {name: 'AES-GCM', length: 256}, false, ['decrypt']);
  let plain = await crypto.subtle.decrypt({name: 'AES-GCM', iv: b64(env.iv)}, key, b64(env.data));
  if (env.gz) plain = await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();
  return JSON.parse(new TextDecoder().decode(plain));
}

document.addEventListener('click', async e => {

  if (t.dataset.tab) { setTab(t.dataset.tab); return; }
  const a = t.dataset.act, cur = S.cur;
  switch (a) {
    case 'save': await save(false); break;
    case 'save-nophoto': await save(true); break;
    case 'photo': if (sheetOpen()) closeSheet(); takePhoto(t.dataset.kind); break;
    case 'more': openMore(); break;
    case 'ack-mismatch': if (cur) { cur.ackMismatch = true; persistCur(); renderCount(); } break;
    case 'type': if (S.typing) { const v = scan.value; scan.value = ''; if (v.trim()) onScan(v, 'typed'); stopTyping(); } else startTyping(); break;
    case 'area': openArea(); break;
    case 'who': openWho(); break;

    case 'area-set': { const st = $('#aStore').value.trim(); if (st) { S.setup.store = st; LS.set('setup', S.setup); } setArea($('#aArea').value); closeSheet(); renderAll(); break; }

    }
    case 'pick': openPick(); break;
    case 'pick-set': {
      const c = ensureCur(); c.product = t.dataset.c; c.productSrc = 'pick'; c.err = ''; c.ackMismatch = false;
      if (c.cands) { const f = c.cands.filter(i => line(i)[1] === c.product); if (f.length) pickCand(f[0]); }
      if (!c.batch && !hasBatchLines(c.product)) { const ls = S.idx.byCode.get(c.product) || []; if (ls.length) c.line = line(ls[0])[0]; }
      closeSheet(); afterChange(false); break;
    }
    case 'note': openNote(); break;
    case 'note-add': { const n = $('#nTxt'); n.value = (n.value ? n.value.trim() + '; ' : '') + t.dataset.t; break; }
    case 'note-set': { const c = ensureCur(); c.note = $('#nTxt').value.trim().slice(0, 300); closeSheet(); persistCur(); renderCount(); break; }
    case 'clear-yes': if (sheetOpen()) closeSheet(); clearCur(); break;
    case 'dup-same': clearCur(); toast('Not counted again'); break;
    case 'dup-piece': if (cur) { cur.dupOk = true; afterChange(false); } break;
    case 'cand': pickCand(+t.dataset.i); afterChange(true); break;
    case 'unk-batch': if (cur) { const raw = cur.unknown; cur.unknown = ''; setBatch({kind: 'none', lines: []}, raw, 'scan'); afterChange(false); } break;
    case 'unk-ignore': if (cur) { cur.unknown = ''; if (!hasData(cur) && !cur.product) S.cur = null; persistCur(); renderCount(); } break;
    case 'held-save': resolveHeld('save'); break;
    case 'held-discard': resolveHeld('discard'); break;
    case 'held-cancel': resolveHeld('cancel'); break;
    case 'viewph': if (cur) { const p = cur.photos[+t.dataset.j]; openSheet(`<h3>${p.kind === 'card' ? 'Drum card' : 'Label'} photo</h3><img class="bigph" src="${esc(p.url)}" alt=""><div class="row"><button class="btn" data-act="delph" data-j="${t.dataset.j}">Remove this photo</button></div>`); } break;
    case 'delph': if (cur) { const p = cur.photos.splice(+t.dataset.j, 1)[0]; if (p) Store.del('photos', p.key); closeSheet(); persistCur(); renderCount(); } break;
    case 'bigph': openSheet(`<img class="bigph" src="${esc(t.dataset.u)}" alt="">`); break;
    case 'close': closeSheet(); break;

    case 'rec-qty': recQtyEditor(t.dataset.id); break;
    case 'rec-qty-save': {
      const r = S.recs.get(t.dataset.id); const q = Number(($('#recEdit').dataset.q) || 0);
      if (!(q > 0)) { toast('Enter the new quantity', true); break; }
      const nq = Math.round(q * 100) / 100;
      await patchRec(r.id, {qty: nq, edits: (r.edits || []).concat([{from: r.qty, to: nq, by: S.setup.team, at: nowIso()}])}); closeSheet(); toast('Quantity changed'); break;
    }
    case 'lf': S.listFilter = t.dataset.f; S.listN = 150; renderList(); break;
    case 'listmore': S.listN += 150; renderList(); break;
    case 'findall': S.findAll = !S.findAll; renderFind(); break;
    case 'send': openSend(); break;
    case 'share': sharePart(+t.dataset.n); break;
    case 'sendall': S.sendAll = !S.sendAll; await prepareSend(); drawSend(); break;
    case 'zip': saveZip(); break;
    case 'change-count': showLoad(); break;
    case 'pickcount': S.pickCount = t.dataset.id; renderLoad(); break;
    case 'unlock': unlock(); break;
    case 'load-cancel': setTab('count'); break;
  }
});
document.addEventListener('input', e => {
  const id = e.target.id;
  if (id === 'listQ') { S.listQ = e.target.value; const pos = e.target.selectionStart; renderList(); const n = $('#listQ'); n.focus(); try { n.setSelectionRange(pos, pos); } catch (err) { /* ignore */ } }
  if (id === 'findQ') { S.findQ = e.target.value; const pos = e.target.selectionStart; renderFind(); const n = $('#findQ'); n.focus(); try { n.setSelectionRange(pos, pos); } catch (err) { /* ignore */ } }
  if (id === 'sTeam' || id === 'sStore' || id === 'sDev') {
    if (id === 'sTeam') S.setup.team = e.target.value.trim();
    if (id === 'sStore') S.setup.store = e.target.value.trim();
    if (id === 'sDev') S.setup.device = e.target.value.trim() || S.setup.device;
    LS.set('setup', S.setup); renderHead();
  }
});
document.addEventListener('change', e => {
  if (e.target.dataset && e.target.dataset.g) {
    const all = [...document.querySelectorAll('#v-setup [data-g]')].filter(x => x.checked).map(x => x.dataset.g);
    S.setup.groups = all.length ? all : null; LS.set('setup', S.setup); renderTabs();
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && sheetOpen()) closeSheet();
  if (e.key === 'Enter' && sheetOpen() && e.target.id === 'aArea') { e.preventDefault(); $('[data-act="area-set"]').click(); }
  if (e.key === 'Enter' && e.target.id === 'code') { e.preventDefault(); unlock(); }
});
function setTab(tab) {
  S.tab = tab;
  $('#v-load').hidden = true; $('#top').hidden = false;
  for (const v of ['count', 'list', 'find', 'setup']) $('#v-' + v).hidden = v !== tab;
  if (S.typing) stopTyping();
  renderAll();
  if (tab === 'count') setTimeout(focusScan, 30); else { try { scan.blur(); } catch (e) { /* ignore */ } }
}

/* ---------- start ---------- */
async function start() {
  if ('serviceWorker' in navigator) {
    const had = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.register('sw.js').catch(() => {});
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (had) toast('App updated'); });
  }
  const id = await Store.get('meta', 'current');
  const list = id ? await Store.get('meta', 'list:' + id) : null;
  if (list) await useList(list); else showLoad();
  if (navigator.storage && navigator.storage.persisted) { try { S.persisted = await navigator.storage.persisted(); } catch (e) { /* ignore */ } }
}
start();
})();
</script>
